name: Python CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-promptfoo:
    name: Resolve promptfoo version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.promptfoo.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve the published promptfoo version once for every test job
        id: promptfoo
        shell: bash
        run: |
          version=$(npm view promptfoo@latest version)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected promptfoo version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: auto

      - name: Pin Python version
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint with Ruff
        run: uv run ruff check src/

      - name: Check formatting
        run: uv run ruff format --check src/

      - name: Check GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify container installation instructions
        run: |
          instruction_dir="$RUNNER_TEMP/promptfoo-docker-help"
          uv run python - "$instruction_dir" <<'PY'
          import sys
          from pathlib import Path

          from promptfoo.environment import Environment
          from promptfoo.instructions import get_installation_instructions

          for label, distro, version in (("alpine", "alpine", None), ("bookworm", "debian", "12"),
                                        ("trixie", "debian", "13"), ("bookworm-env", "debian", "12"),
                                        ("bookworm-npmrc", "debian", "12")):
              instructions = get_installation_instructions(
                  Environment(os_type="linux", linux_distro=distro, linux_distro_version=version, is_docker=True)
              )
              commands = [line.strip() for line in instructions.splitlines()]
              commands = [command for command in commands if command.startswith(("FROM ", "COPY ", "RUN ", "ENV "))]
              if distro == "debian":
                  runtime = next(index for index, command in enumerate(commands) if command.startswith("FROM python:"))
                  inherited = ["RUN python -c 'import pathlib, sysconfig; "
                               "(pathlib.Path(sysconfig.get_path(\"purelib\")) / \"promptfoo_help_probe.py\").touch()'"]
                  if label in ("bookworm-env", "bookworm-npmrc"):
                      inherited += ["RUN useradd -m app && mkdir -p /home/app/.npm-global "
                                    "&& chown app:app /home/app/.npm-global",
                                    'ENV PATH="/usr/local/bin:/home/app/.npm-global/bin:/usr/bin:/bin"']
                      if label == "bookworm-env":
                          inherited.append('ENV NPM_CONFIG_PREFIX="/home/app/.npm-global"')
                      else:
                          inherited.append("RUN printf '%s\\n' 'prefix=/home/app/.npm-global' > /home/app/.npmrc "
                                           "&& chown app:app /home/app/.npmrc")
                  else:
                      inherited.append('ENV PATH="/opt/venv/bin:/usr/bin:/bin"')
                  commands[runtime + 1:runtime + 1] = inherited
              directory = Path(sys.argv[1]) / label
              directory.mkdir(parents=True, exist_ok=True)
              (directory / "Dockerfile").write_text("\n".join(commands) + "\n")
          PY
          for distro in alpine bookworm trixie bookworm-env bookworm-npmrc; do
            cat >> "$instruction_dir/$distro/Dockerfile" <<'EOF'
          RUN node --version | grep -E '^v24\.' \
              && npm --version && npx --version && python --version && pip --version
          EOF
            if [ "$distro" = alpine ]; then
              echo 'RUN python -c "import sys; assert sys.prefix == \"/opt/venv\""' >> "$instruction_dir/$distro/Dockerfile"
            else
              cat >> "$instruction_dir/$distro/Dockerfile" <<'EOF'
          RUN python -c "import sys, promptfoo_help_probe; assert sys.version_info[:2] == (3, 12)"
          RUN env PATH=/opt/venv/bin:/usr/bin:/bin sh -c "node --version && npm --version && npx --version"
          RUN dpkg-query -W -f='${Version}' nodejs | grep -E '^24\.' \
              && apt-get update && apt-get install -y --no-install-recommends nodejs \
              && node --version | grep -E '^v24\.' && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /tmp/promptfoo-fixture /opt/venv/bin \
              && printf '%s\n' '{"name":"promptfoo","version":"1.0.0","bin":"cli.js"}' > /tmp/promptfoo-fixture/package.json \
              && printf '%s\n' '#!/usr/bin/env node' 'console.log("global-promptfoo")' > /tmp/promptfoo-fixture/cli.js \
              && chmod +x /tmp/promptfoo-fixture/cli.js \
              && printf '%s\n' '#!/bin/sh' 'echo python-promptfoo' > /usr/local/bin/promptfoo \
              && chmod +x /usr/local/bin/promptfoo && cp /usr/local/bin/promptfoo /opt/venv/bin/promptfoo \
              && npm pack --offline --ignore-scripts --pack-destination /tmp /usr/lib/node_modules/npm
          EOF
              case "$distro" in
                bookworm-env|bookworm-npmrc)
                  cat >> "$instruction_dir/$distro/Dockerfile" <<'EOF'
          ENV HOME=/home/app
          USER app
          RUN test "$(npm prefix --global)" = /home/app/.npm-global && test "$(command -v promptfoo)" = /usr/local/bin/promptfoo
          EOF
                  ;;
                *)
                  cat >> "$instruction_dir/$distro/Dockerfile" <<'EOF'
          RUN test "$(npm prefix --global)" = /usr && test "$(command -v promptfoo)" = /opt/venv/bin/promptfoo
          EOF
                  ;;
              esac
              cat >> "$instruction_dir/$distro/Dockerfile" <<'EOF'
          RUN prefix="$(npm prefix --global)" \
              && python -c "import sysconfig; assert sysconfig.get_path('scripts') != '$prefix/bin'" \
              && npm install --offline --no-audit --no-fund --global /tmp/promptfoo-fixture \
              && test "$(promptfoo)" = python-promptfoo && test "$("$prefix/bin/promptfoo")" = global-promptfoo \
              && npm install --offline --no-audit --no-fund --global /tmp/npm-*.tgz \
              && hash -r \
              && test "$(readlink -f "$(command -v npm)")" = "$prefix/lib/node_modules/npm/bin/npm-cli.js" \
              && test "$(readlink -f "$(command -v npx)")" = "$prefix/lib/node_modules/npm/bin/npx-cli.js" \
              && npm --version && npx --version
          EOF
            fi
            docker build --progress=plain "$instruction_dir/$distro"
          done
          docker run --rm alpine:3.20 sh -ec '
            apk update
            apk add --no-cache nodejs npm
            case "$(node --version)" in
              v20.*) ;;
              *) echo "Expected Alpine 3.20 to supply Node.js 20" >&2; exit 1 ;;
            esac
            if apk add --no-cache "nodejs~24" npm; then
              echo "Alpine 3.20 unexpectedly installed Node.js 24" >&2
              exit 1
            fi
          '

  type-check:
    name: Type Check (${{ matrix.type-checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        type-checker: [mypy, pyright]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: auto

      - name: Pin Python version
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Type check with mypy
        if: matrix.type-checker == 'mypy'
        run: uv run mypy src/promptfoo/

      - name: Type check with pyright
        if: matrix.type-checker == 'pyright'
        run: uv run pyright src/promptfoo/

  test:
    name: Test (py${{ matrix.python-version }}, node${{ matrix.node-version }}, ${{ matrix.os }})
    needs: resolve-promptfoo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PROMPTFOO_VERSION: ${{ needs.resolve-promptfoo.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily excluding macos-latest due to GitHub Actions runner resource constraints
        # causing BlockingIOError [Errno 35] when spawning subprocess
        os: [ubuntu-latest, windows-latest]
        # Test only min and max supported Python versions for efficiency
        python-version: ["3.10", "3.14"]
        include:
          - python-version: "3.10"
            node-version: "22.22.0"
          - python-version: "3.14"
            node-version: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Configure npm on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "npm-cache"
          $globalPrefix = Join-Path $env:RUNNER_TEMP "npm-global"
          New-Item -ItemType Directory -Force -Path $cacheDir, $globalPrefix | Out-Null
          "NPM_CONFIG_CACHE=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CONFIG_PREFIX=$globalPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $globalPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install promptfoo globally
        shell: bash
        run: npm install --global "promptfoo@$PROMPTFOO_VERSION"
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: auto

      - name: Pin Python version
        run: uv python pin ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev

      - name: Verify the wrapper can find the global npm installation
        run: uv run python -c "from promptfoo.cli import _find_external_promptfoo; path = _find_external_promptfoo(); print(path); assert path is not None"

      - name: Run unit tests
        run: uv run pytest tests/ -v -m 'not smoke'

      - name: Run smoke tests
        run: uv run pytest tests/smoke/ -v

      - name: Test CLI can be invoked
        run: uv run promptfoo --version

      - name: Test Node.js detection
        run: uv run python -c "from promptfoo.cli import check_node_installed, check_npx_installed; assert check_node_installed(); assert check_npx_installed()"

  test-npx-fallback:
    name: Test npx fallback (py${{ matrix.python-version }}, node${{ matrix.node-version }}, ${{ matrix.os }})
    needs: resolve-promptfoo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PROMPTFOO_VERSION: ${{ needs.resolve-promptfoo.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # Test npx fallback (without global install)
        # Temporarily excluding macos-latest due to GitHub Actions runner resource constraints
        os: [ubuntu-latest, windows-latest]
        # Use middle-version Python for this test
        python-version: ["3.12"]
        node-version: ["22.22.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Configure npm on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "npm-cache"
          $globalPrefix = Join-Path $env:RUNNER_TEMP "npm-global"
          New-Item -ItemType Directory -Force -Path $cacheDir, $globalPrefix | Out-Null
          "NPM_CONFIG_CACHE=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CONFIG_PREFIX=$globalPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Intentionally skip installing promptfoo globally
      # This tests the npx fallback path

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: auto

      - name: Pin Python version
        run: uv python pin ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev

      - name: Verify the wrapper must fall back to npx
        run: uv run python -c "from promptfoo.cli import _find_external_promptfoo, check_npx_installed; path = _find_external_promptfoo(); print(path); assert path is None; assert check_npx_installed()"

      - name: Run unit tests
        run: uv run pytest tests/ -v -m 'not smoke'

      - name: Run smoke tests (with npx fallback)
        run: uv run pytest tests/smoke/ -v

      - name: Test CLI fallback to npx (no global install)
        run: uv run promptfoo --version

      - name: Test Node.js detection
        run: uv run python -c "from promptfoo.cli import check_node_installed, check_npx_installed; assert check_node_installed(); assert check_npx_installed()"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: auto

      - name: Pin Python version
        run: uv python pin 3.12

      - name: Build package
        run: uv build

      - name: Check distribution metadata with Twine
        run: uvx --from twine --constraints .github/requirements-twine.txt twine check --strict dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  ci-success:
    name: CI Success
    needs: [resolve-promptfoo, lint, type-check, test, test-npx-fallback, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check if all jobs succeeded
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $JOB_RESULTS"
          [[ "$JOB_RESULTS" =~ ^success(,success)*$ ]]
